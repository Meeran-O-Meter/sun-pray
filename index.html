<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>SunPray</title>
</head>
<body>
    <div class="welcome">
        <div class="left-side">
            <p class="title">WELCOME TO
                <br>
                <span class="title">SUNPRAY</span>
            </p>
            <embed class="logo" src="./assets/Logo.svg">        
        </div>

        <div class="right-side">
            <div class="clock-display">
                <h1 id="clock" class="clock"></h1>
            </div>

            <p class="quote">
                Indeed, prayer has been decreed upon the believers a decree of specific times.
            </p>

            <button class="check-prayer-time">
                
                <a href="#prayer-times">
                    CHECK MY PRAYER TIMES
                </a>

            </button>
        </div>        
    </div>

<section id="prayer-times">
    <div class="both">
        <div class="right-side-2">
            <p class="title-2">
                Your current <span>prayer times</span>
            </p>

            <select id="dropdown" name="calculation-method">
                <option value="2" selected>ISNA</option>
                <option value="3">Muslim World League</option>
                <option value="4">Umm Al-Qura, Makkah</option>
                <option value="5">Egyptian National Authority of Survey</option>
                <option value="1">University of Islamic Sciences, Karachi</option>
                <option value="9">Kuwait</option>
                <option value="10">Qatar</option>
                <option value="11">Singapore</option>
            </select>

            <select id="school" name="school">
                <option value="1">Standard (Shafi, Hanafi, Maliki)</option>
                <option value="0">Hanafi</option>
            </select>

            <button id="get-prayer-times-button" style="width: 100%; margin-top: 0;" class="check-prayer-time">     
                <a id="get-prayer-times-button">
                    CHECK MY PRAYER TIMES
                </a>
            </button>

            <p id="loading" class="loading">We're fetching your prayer times...</p>
        </div>

        <div class="prayer-container">
                <p class="prayer-times-day">YOUR <span>PRAYER TIMES</span> FOR THE DAY</p>

                <div class="time-container">
                    <p class="prayer-title">FAJR</p>
                    <p id="fajr" class="time"></p>
                </div>

                <div class="time-container">
                    <p class="prayer-title">SUNRISE</p>
                    <p id="sunrise" class="time"></p>
                </div>

                <div class="time-container">
                    <p class="prayer-title">ZHUR</p>
                    <p id="zhur" class="time"></p>
                </div>

                <div class="time-container">
                    <p class="prayer-title">ASR</p>
                    <p id="asr" class="time"></p>
                </div>

                <div class="time-container">
                    <p class="prayer-title">MAGHRIB</p>
                    <p id="maghrib" class="time"></p>
                </div>

                <div class="time-container">
                    <p class="prayer-title">ESHA</p>
                    <p id="esha" class="time"></p>
                </div>
        </div>
    </div>

</section>

<script src="./script.js"></script>
</body>
</html>
