<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <title>SunPray</title>
</head>
<body>
    <div class="welcome">
        <div class="left-side">
            <p class="title">WELCOME TO
                <br>
                <span class="title">SUNPRAY</span>
            </p>
            <embed class="logo" src="./assets/Logo.svg">        
        </div>

        <div class="right-side">
            <div class="clock-display">
                <h1 id="clock" class="clock"></h1>
            </div>

            <p class="quote">
                Indeed, prayer has been decreed upon the believers a decree of specific times.
            </p>

            <button class="check-prayer-time">
                
                <a href="#prayer-times">
                    CHECK MY PRAYER TIMES
                </a>

            </button>
        </div>        
    </div>

<section id="prayer-times">
    <div class="right-side-2">
        <p class="title-2">
            Your current <span>prayer times</span>
        </p>

        <select id="dropdown" name="calculation-method">
            <option value="" disabled selected hidden>Calculation Method</option>
            <option value="ISNA">ISNA</option>
            <option value="Muslim World League">Muslim World League</option>
            <option value="Umm Al-Qura, Makkah">Umm Al-Qura, Makkah</option>
            <option value="Egyptian National Authority of Survey">Egyptian National Authority of Survey</option>
            <option value="University of Islamic Sciences, Karachi">University of Islamic Sciences, Karachi</option>
            <option value="Kuwait">Kuwait</option>
            <option value="Qatar">Qatar</option>
            <option value="Singapore">Singapore</option>
        </select>

        <button style="width: 100%; margin-top: 0;" class="check-prayer-time">     
            <a>
                CHECK MY PRAYER TIMES
            </a>
        </button>

        <div class="details">
            <p class="details-title">DETAILS</p>
            <p id="address" class="details-info"></p>
            <p id="date" class="details-info"></p>
            <p id="time-zone" class="details-info"></p>
            <p id="calculation-method" class="details-info"></p>
        </div>


    </div>

</section>
</body>
</html>
