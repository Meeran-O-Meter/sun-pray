<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <title>SunPray</title>
</head>
<body>
    <welcome class="welcome">
        <div class="left-side">
            <p class="title">WELCOME TO
                <br>
                <span class="title">SUNPRAY</span>
            </p>
            <embed class="logo" src="./assets/Logo.svg">        
        </div>

        <div class="right-side">
            <div class="clock-display">
                <h1 id="clock" class="clock"></h1>
            </div>

            <p class="quote">
                Indeed, prayer has been decreed upon the believers a decree of specific times.
            </p>

            <button class="check-prayer-time">
                CHECK MY PRAYER TIMES
            </button>
        </div>        
    </welcome>




    
</body>
</html>
